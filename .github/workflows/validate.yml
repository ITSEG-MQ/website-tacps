name: Validate site

on:
  push:
    branches:
      - "feature/**"
      - "feat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate source and tests
        run: |
          python scripts/validate_site.py
          python -m unittest discover -s tests -v

      - name: Use production config
        run: |
          test -f _config_prod.yml || { echo "::error ::_config_prod.yml not found"; exit 1; }
          cp _config_prod.yml _config.yml
          echo "Using _config_prod.yml as _config.yml for this build"

      - name: Build production preview
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site
        env:
          JEKYLL_ENV: production

      - name: Validate generated site
        run: python scripts/validate_site.py --site _site --config _config_prod.yml

      - name: Upload validated preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-preview
          path: _site
          retention-days: 7
          if-no-files-found: error
